[project]
name = "state-of-data-dashboard"
version = "0.1.0"
description = "Plataforma analítica open source para explorar o State of Data Brazil."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "dbt-core>=1.9,<2",
  "dbt-duckdb>=1.9,<2",
  "duckdb>=1.5.5,<2",
  "jinja2>=3.1,<4",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "streamlit>=1.45,<2",
  "structlog>=25,<26",
]

[project.scripts]
state-of-data = "state_of_data.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.1,<7",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/state_of_data"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["state_of_data"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["state_of_data"]

[tool.coverage.report]
fail_under = 85
show_missing = true

name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    env:
      DO_NOT_TRACK: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.x"
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Format check
        run: .venv/bin/ruff format --check .
      - name: Type check
        run: .venv/bin/mypy
      - name: Unit tests
        run: .venv/bin/pytest --cov=state_of_data --cov-report=term-missing
      - name: Resolve dbt packages
        run: .venv/bin/dbt deps --project-dir analytics --profiles-dir analytics
      - name: Parse analytics project
        run: .venv/bin/dbt parse --project-dir analytics --profiles-dir analytics
      - name: Audit dependencies
        run: .venv/bin/pip-audit
